<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Hogar · Prisma</title>

  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hogar Prisma" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* --- [ CSS intacto, no modificado ] --- */
/* (idéntico a tu versión original) */
</style>
</head>

<body>
<div id="root">
  <div class="loading">cargando...</div>
</div>

<script>
/* ===============================
   Datos base
================================ */

var SPACES = [
  {id:"jardin",name:"Jardín delantero",icon:"🌿"},
  {id:"auto",name:"Auto",icon:"🚗"},
  {id:"living",name:"Living",icon:"🛋️"},
  {id:"cocina",name:"Cocina",icon:"🍳"},
  {id:"bano",name:"Baño",icon:"🚿"},
  {id:"pasillo",name:"Pasillo",icon:"🚪"},
  {id:"pieza",name:"Pieza",icon:"🛏️"},
  {id:"oficina",name:"Oficina",icon:"💻"},
  {id:"pieza_atras",name:"Pieza de atrás",icon:"📦"},
  {id:"patio",name:"Patio",icon:"☀️"},
  {id:"pasillo_patio",name:"Pasillo patio",icon:"🌀"},
  {id:"bodegas",name:"Bodegas",icon:"🗄️"}
];

var STATES = [
  {id:5,symbol:"✦",label:"Ordenado y adornado",short:"Adornado",color:"#6C63FF",bg:"#f0eeff",text:"#3d3580"},
  {id:4,symbol:"🟦",label:"Ordenado (interior)",short:"Interior OK",color:"#3B82F6",bg:"#eff6ff",text:"#1d4ed8"},
  {id:3,symbol:"🟩",label:"Ordenado (exterior)",short:"Exterior OK",color:"#22C55E",bg:"#f0fdf4",text:"#15803d"},
  {id:2,symbol:"🟨",label:"Desordenado habitable",short:"Habitable",color:"#EAB308",bg:"#fefce8",text:"#854d0e"},
  {id:1,symbol:"🟧",label:"Desordenado incómodo",short:"Incómodo",color:"#F97316",bg:"#fff7ed",text:"#9a3412"},
  {id:0,symbol:"🟥",label:"Insulto a la dignidad",short:"Crítico",color:"#EF4444",bg:"#fef2f2",text:"#991b1b"}
];

var WEEKLY = {
  0:[],
  1:["living","cocina"],
  2:["bano","pasillo"],
  3:["pieza","oficina"],
  4:["pieza_atras","patio"],
  5:["pasillo_patio","bodegas"],
  6:["jardin","auto"]
};

var DAYS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

var USERS = {
  Cris:{ color:"#6C63FF", avatar:"🧔" },
  Syl:{ color:"#FF6B9D", avatar:"👩" }
};

/* ===============================
   Estado global
================================ */

var map = {};
var notes = {};
var messages = [];
var picking = null;
var viewingNotes = false;
var chatOpen = false;
var status = "config";

SPACES.forEach(s => map[s.id] = 2);

/* ===============================
   Utils seguros
================================ */

function esc(s){
  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function getSt(id){
  return STATES.find(s => s.id === id) || STATES[3];
}

/* ===============================
   Firebase helpers
================================ */

var dbUrl = localStorage.getItem("prisma-db-url") || "";
var currentUser = localStorage.getItem("prisma-user") || "";

function cleanUrl(){
  return dbUrl.replace(/\/$/,"");
}

function fbPushMsg(msg){
  return fetch(cleanUrl()+"/chat.json",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify(msg)
  });
}

/* ===============================
   Chat
================================ */

function sendMessage(txt){
  if(!txt || !txt.trim() || !currentUser) return;

  var msg = {
    user: currentUser,
    text: txt.trim(),
    ts: Date.now()
  };

  messages.push(msg);
  render();
  scrollChat();

  fbPushMsg(msg).catch(console.error);
}

function scrollChat(){
  setTimeout(()=>{
    var el = document.getElementById("chat-msgs");
    if(el) el.scrollTop = el.scrollHeight;
  },50);
}

/* ===============================
   Render
================================ */

function render(){
  var root = document.getElementById("root");
  if(!root) return;

  if(!currentUser){
    root.innerHTML = "<h2 style='padding:40px'>Selecciona usuario</h2>";
    return;
  }

  var user = USERS[currentUser] || {};
  var userColor = user.color || "#6C63FF";
  var userAvatar = user.avatar || "👤";

  var h = `
    <div class="app">
      <h1>💬 Chat del Hogar</h1>

      <div class="chat-messages" id="chat-msgs">
        ${
          messages.length === 0
          ? "<div style='color:#ccc'>Sin mensajes aún</div>"
          : messages.map(m=>{
              var isMe = m.user === currentUser;
              return `
                <div class="msg ${isMe?"me":"them"}">
                  ${!isMe?`<div class="msg-author">${esc(m.user)}</div>`:""}
                  <div class="msg-bubble">${esc(m.text)}</div>
                </div>
              `;
            }).join("")
        }
      </div>

      <div class="chat-input-row">
        <input id="chat-in" class="chat-input" placeholder="Escribe..." />
        <button id="chat-send" class="chat-send">➤</button>
      </div>
    </div>
  `;

  root.innerHTML = h;

  document.getElementById("chat-send").onclick = ()=>{
    var inp = document.getElementById("chat-in");
    var txt = inp.value;
    inp.value="";
    sendMessage(txt);
  };

  document.getElementById("chat-in").onkeydown = e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      var inp=e.target;
      var txt=inp.value;
      inp.value="";
      sendMessage(txt);
    }
  };

  scrollChat();
}

/* ===============================
   Init
================================ */

render();
</script>
</body>
</html>
