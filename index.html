
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Hogar · Prisma</title>
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hogar Prisma" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f7f7f5; --white: #ffffff; --dark: #1a1a2e; --gray: #555555;
      --light: #aaaaaa; --border: #ebebeb; --soft: #f0eeff; --accent: #6C63FF;
    }
    html, body { height: 100%; background: var(--bg); font-family: 'DM Sans', sans-serif; }
    body { padding: 0; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    .app { max-width: 560px; margin: 0 auto; padding: 28px 16px 80px; }
    .header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
    .header-left .eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--light); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
    .header-left h1 { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--dark); line-height: 1.1; }
    .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .pill { background: var(--dark); color: #fff; font-family: 'DM Mono', monospace; font-size: 10px; padding: 6px 14px; border-radius: 99px; letter-spacing: 1px; white-space: nowrap; }
    .sync { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--light); }
    .sync.live { color: #22C55E; } .sync.saving { color: var(--accent); } .sync.error { color: #EF4444; }
    .score-wrap { text-align: center; margin-bottom: 28px; }
    .score-card { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; background: var(--white); border: 1px solid var(--border); border-radius: 16px; padding: 20px 40px; }
    .score-eyebrow { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--light); letter-spacing: 2px; text-transform: uppercase; }
    .score-num { font-family: 'DM Serif Display', serif; font-size: 52px; line-height: 1; }
    .score-pct { font-family: 'DM Mono', monospace; font-size: 16px; color: #bbb; }
    .bar-bg { width: 160px; height: 6px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
    .alert { display: flex; align-items: center; gap: 12px; background: #fef2f2; border: 2px solid #EF4444; border-radius: 14px; padding: 14px 18px; margin-bottom: 24px; }
    .alert-title { font-weight: 700; font-size: 14px; color: #991b1b; }
    .alert-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: #EF4444; margin-top: 2px; }
    .section-label { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--light); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 28px; }
    .card { background: var(--white); border: 2px solid var(--border); border-radius: 14px; padding: 14px 16px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; position: relative; -webkit-tap-highlight-color: transparent; user-select: none; }
    .card:active { transform: scale(0.97); }
    .badge { position: absolute; top: -9px; right: 10px; font-family: 'DM Mono', monospace; font-size: 8px; padding: 2px 8px; border-radius: 99px; color: #fff; letter-spacing: 1px; text-transform: uppercase; }
    .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .card-name { display: flex; align-items: center; gap: 8px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--dark); }
    .card-pill { display: inline-block; font-family: 'DM Mono', monospace; font-size: 10px; padding: 3px 10px; border-radius: 99px; font-weight: 500; }
    .loading { display: flex; align-items: center; justify-content: center; height: 200px; font-family: 'DM Mono', monospace; font-size: 13px; color: var(--light); }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
    .sheet { background: var(--white); border-radius: 24px 24px 0 0; padding: 28px 24px 44px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; animation: up 0.22s ease; }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .handle { width: 36px; height: 4px; background: var(--border); border-radius: 99px; margin: 0 auto 20px; }
    .sheet-title { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--dark); margin-bottom: 4px; }
    .sheet-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--light); margin-bottom: 20px; }
    .opt { display: flex; align-items: center; gap: 12px; background: #fafafa; border: 2px solid var(--border); border-radius: 12px; padding: 13px 16px; cursor: pointer; margin-bottom: 8px; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
    .opt:active { transform: scale(0.98); }
    .opt-sym { font-size: 20px; width: 26px; }
    .opt-label { font-size: 14px; flex: 1; }
    .btn-cancel { margin-top: 8px; width: 100%; padding: 12px; background: none; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--light); }
    .legend { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
    .legend-row { display: flex; align-items: center; gap: 10px; padding: 3px 0; }
    .legend-sym { font-size: 15px; width: 22px; }
    .legend-txt { font-size: 13px; color: var(--gray); }
    .btn-export { width: 100%; padding: 15px 20px; background: var(--dark); color: #fff; border: none; border-radius: 14px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px; -webkit-tap-highlight-color: transparent; }
    .btn-export:active { opacity: 0.8; }
    .btn-export:disabled { background: var(--soft); color: var(--accent); cursor: default; }
    .btn-sm { width: 100%; padding: 10px; background: none; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 10px; color: #ccc; margin-bottom: 10px; }
    .hint { text-align: center; font-family: 'DM Mono', monospace; font-size: 10px; color: #ccc; }
    /* Config */
    .config-screen { position: fixed; inset: 0; background: var(--bg); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .config-card { background: var(--white); border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,0.1); }
    .config-title { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--dark); margin-bottom: 8px; }
    .config-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--light); margin-bottom: 24px; line-height: 1.7; }
    .config-label { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--gray); margin-bottom: 8px; display: block; }
    .config-input { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 12px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--dark); background: #fafafa; outline: none; margin-bottom: 8px; }
    .config-input:focus { border-color: var(--accent); }
    .config-err { font-family: 'DM Mono', monospace; font-size: 11px; color: #EF4444; margin-bottom: 16px; display: none; }
    .btn-primary { width: 100%; padding: 14px; background: var(--dark); color: #fff; border: none; border-radius: 12px; font-family: 'DM Mono', monospace; font-size: 13px; cursor: pointer; letter-spacing: 1px; }
    /* Notes */
    .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .note-btn { background: none; border: none; cursor: pointer; font-size: 20px; padding: 4px 6px; border-radius: 8px; transition: background 0.15s; -webkit-tap-highlight-color: transparent; line-height: 1; }
    .note-btn:active { background: #f0eeff; }
    .note-btn.has-note { position: relative; }
    .note-btn.has-note::after { content: ''; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; background: var(--accent); border-radius: 99px; border: 2px solid #fff; }
    .note-view { animation: up 0.18s ease; }
    .note-back { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--light); padding: 0; margin-bottom: 20px; -webkit-tap-highlight-color: transparent; }
    .note-back:active { opacity: 0.6; }
    .note-textarea { width: 100%; min-height: 160px; padding: 14px 16px; border: 2px solid var(--border); border-radius: 14px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--dark); background: #fafafa; outline: none; resize: none; line-height: 1.6; transition: border-color 0.15s; }
    .note-textarea:focus { border-color: var(--accent); background: #fff; }
    .note-save { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: 12px; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 1px; margin-top: 10px; -webkit-tap-highlight-color: transparent; }
    .note-save:active { opacity: 0.85; }
    .note-hint { font-family: 'DM Mono', monospace; font-size: 10px; color: #ccc; text-align: center; margin-top: 10px; }
    .card-note-dot { display: inline-block; width: 6px; height: 6px; background: var(--accent); border-radius: 99px; margin-left: 5px; vertical-align: middle; }
    /* Chat */
    .chat-btn { position: relative; background: none; border: none; cursor: pointer; font-size: 22px; padding: 4px; line-height: 1; -webkit-tap-highlight-color: transparent; }
    .chat-btn .unread { position: absolute; top: 0; right: 0; min-width: 16px; height: 16px; background: #EF4444; border-radius: 99px; border: 2px solid #fff; font-family: 'DM Mono', monospace; font-size: 9px; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0 3px; }
    .chat-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; z-index: 250; }
    .chat-sheet { background: var(--white); border-radius: 24px 24px 0 0; width: 100%; max-width: 560px; height: 85vh; display: flex; flex-direction: column; animation: up 0.22s ease; }
    .chat-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .chat-head-row { display: flex; align-items: center; justify-content: space-between; }
    .chat-title { font-family: 'DM Serif Display', serif; font-size: 20px; color: var(--dark); }
    .chat-user-badge { font-family: 'DM Mono', monospace; font-size: 10px; padding: 4px 12px; border-radius: 99px; color: #fff; }
    .chat-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--light); padding: 4px; -webkit-tap-highlight-color: transparent; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { display: flex; flex-direction: column; max-width: 78%; }
    .msg.me { align-self: flex-end; align-items: flex-end; }
    .msg.them { align-self: flex-start; align-items: flex-start; }
    .msg-author { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--light); margin-bottom: 3px; }
    .msg-bubble { padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; word-break: break-word; }
    .msg.me .msg-bubble { background: var(--me-color, #6C63FF); color: #fff; border-bottom-right-radius: 4px; }
    .msg.them .msg-bubble { background: #f0f0f0; color: var(--dark); border-bottom-left-radius: 4px; }
    .msg-time { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--light); margin-top: 3px; }
    .chat-input-row { display: flex; gap: 10px; padding: 14px 20px 30px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .chat-input { flex: 1; padding: 12px 16px; border: 2px solid var(--border); border-radius: 22px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--dark); background: #fafafa; outline: none; transition: border-color 0.15s; }
    .chat-input:focus { border-color: var(--accent); background: #fff; }
    .chat-send { width: 44px; height: 44px; background: var(--accent); border: none; border-radius: 99px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
    .chat-send:active { opacity: 0.8; }
    /* User picker */
    .user-screen { position: fixed; inset: 0; background: var(--bg); z-index: 400; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .user-card { background: var(--white); border-radius: 20px; padding: 36px 28px; width: 100%; max-width: 340px; box-shadow: 0 8px 40px rgba(0,0,0,0.1); text-align: center; }
    .user-title { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--dark); margin-bottom: 8px; }
    .user-sub { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--light); margin-bottom: 32px; }
    .user-options { display: flex; flex-direction: column; gap: 12px; }
    .user-opt { padding: 16px; border-radius: 14px; border: 2px solid var(--border); cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent; }
    .user-opt:active { transform: scale(0.97); }
    .user-opt-name { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--dark); }
    .user-opt-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--light); margin-top: 2px; }
  </style>
</head>
<body>
<div id="root"><div class="loading">cargando...</div></div>
<script>
const SPACES=[{id:"jardin",name:"Jardín delantero",icon:"🌿"},{id:"auto",name:"Auto",icon:"🚗"},{id:"living",name:"Living",icon:"🛋️"},{id:"cocina",name:"Cocina",icon:"🍳"},{id:"bano",name:"Baño",icon:"🚿"},{id:"pasillo",name:"Pasillo",icon:"🚪"},{id:"pieza",name:"Pieza",icon:"🛏️"},{id:"oficina",name:"Oficina",icon:"💻"},{id:"pieza_atras",name:"Pieza de atrás",icon:"📦"},{id:"patio",name:"Patio",icon:"☀️"},{id:"pasillo_patio",name:"Pasillo patio",icon:"🌀"},{id:"bodegas",name:"Bodegas",icon:"🗄️"}];
const STATES=[{id:5,symbol:"✦",label:"Ordenado y adornado",short:"Adornado",color:"#6C63FF",bg:"#f0eeff",text:"#3d3580"},{id:4,symbol:"🟦",label:"Ordenado (interior)",short:"Interior OK",color:"#3B82F6",bg:"#eff6ff",text:"#1d4ed8"},{id:3,symbol:"🟩",label:"Ordenado (exterior)",short:"Exterior OK",color:"#22C55E",bg:"#f0fdf4",text:"#15803d"},{id:2,symbol:"🟨",label:"Desordenado habitable",short:"Habitable",color:"#EAB308",bg:"#fefce8",text:"#854d0e"},{id:1,symbol:"🟧",label:"Desordenado incómodo",short:"Incómodo",color:"#F97316",bg:"#fff7ed",text:"#9a3412"},{id:0,symbol:"🟥",label:"Insulto a la dignidad",short:"Crítico",color:"#EF4444",bg:"#fef2f2",text:"#991b1b"}];
const WEEKLY={1:["living","cocina"],2:["bano","pasillo"],3:["pieza","oficina"],4:["pieza_atras","patio"],5:["pasillo_patio","bodegas"],6:["jardin","auto"],0:[]};
const DAYS=["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const DEF=Object.fromEntries(SPACES.map(s=>[s.id,2]));
const getSt=id=>STATES.find(s=>s.id===id)||STATES[3];

function safeGet(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function safeGetInt(k,d){try{return parseInt(localStorage.getItem(k)||d)||0;}catch(e){return 0;}}

let map={...DEF},notes={},messages=[],picking=null,viewingNotes=false,chatOpen=false,status="config",dbUrl=safeGet("prisma-db-url"),currentUser=safeGet("prisma-user"),es=null,chatEs=null,saveTimer=null,noteTimer=null,exporting=false,lastReadTs=safeGetInt("prisma-last-read","0");

const USERS={
  Cris:{color:"#7B9DB4",avatar:"🧔"},
  Syl:{color:"#6C63FF",avatar:"👩"}
};

// ── Firebase ──
const fbStatesUrl=()=>dbUrl.replace(/\/$/,"")+"/hogar/states.json";
const fbNotesUrl=()=>dbUrl.replace(/\/$/,"")+"/hogar/notes.json";
const fbRootUrl=()=>dbUrl.replace(/\/$/,"")+"/hogar.json";
const fbChatUrl=()=>dbUrl.replace(/\/$/,"")+"/chat.json";
async function fbGet(){const r=await fetch(fbRootUrl());if(!r.ok)throw new Error();const d=await r.json()||{};return d;}
async function fbSetStates(d){const r=await fetch(fbStatesUrl(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw new Error();}
async function fbSetNote(id,txt){const r=await fetch(dbUrl.replace(/\/$/,"")+`/hogar/notes/${id}.json`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(txt)});if(!r.ok)throw new Error();}
async function fbPushMsg(msg){const r=await fetch(fbChatUrl(),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(msg)});if(!r.ok)throw new Error();}
async function fbGetChat(){const r=await fetch(fbChatUrl());if(!r.ok)return[];const d=await r.json();if(!d)return[];return Object.values(d).sort((a,b)=>a.ts-b.ts);}

function unreadCount(){return messages.filter(m=>m.ts>lastReadTs&&m.user!==currentUser).length;}

function markRead(){lastReadTs=Date.now();safeSet("prisma-last-read",lastReadTs);}

function sanitizeMap(raw){
  const result={...DEF};
  if(raw&&typeof raw==="object"){
    SPACES.forEach(s=>{if(s.id in raw)result[s.id]=parseInt(raw[s.id])||0;});
  }
  return result;
}

function listen(){
  if(es){es.close();}
  es=new EventSource(dbUrl.replace(/\/$/,"")+"/hogar.json");
  es.addEventListener("put",e=>{try{const m=JSON.parse(e.data);if(m.data&&typeof m.data==="object"){
    map=sanitizeMap(m.data.states||m.data);
    notes={...(m.data.notes||{})};
    status="live";render();
  }}catch(err){}});
  es.addEventListener("patch",e=>{try{const m=JSON.parse(e.data);if(m.data){
    if(m.data.states)map=sanitizeMap({...map,...m.data.states});
    if(m.data.notes)notes={...notes,...m.data.notes};
    status="live";render();
  }}catch(err){}});
  es.onerror=()=>{status="error";render();setTimeout(()=>{if(dbUrl)listen();},4000);};
}

function listenChat(){
  if(chatEs)chatEs.close();
  chatEs=new EventSource(dbUrl.replace(/\/$/,"")+"/chat.json");
  chatEs.addEventListener("put",e=>{try{const m=JSON.parse(e.data);if(m.data&&typeof m.data==="object"){messages=Object.values(m.data).sort((a,b)=>a.ts-b.ts);render();scrollChat();}else if(!m.data){messages=[];}}catch(err){}});
  chatEs.addEventListener("patch",e=>{try{const m=JSON.parse(e.data);if(m.data){const newMsgs=Object.values(m.data);const allMsgs=[...messages,...newMsgs];const seen=new Set();const deduped=allMsgs.filter(msg=>{const key=msg.ts+"|"+msg.user+"|"+msg.text;if(seen.has(key))return false;seen.add(key);return true;}).sort((a,b)=>a.ts-b.ts);messages=deduped;render();scrollChat();}}catch(err){}});
}

function scrollChat(){setTimeout(()=>{const el=document.getElementById("chat-msgs");if(el)el.scrollTop=el.scrollHeight;},50);}

async function init(){
  if(!currentUser){render();return;}
  if(!dbUrl){status="config";render();return;}
  try{
    status="connecting";render();
    const d=await fbGet();
    map=sanitizeMap(d.states||d);
    notes={...(d.notes||{})};
    messages=await fbGetChat();
    status="live";render();listen();listenChat();
  }catch(e){status="error";render();}
}

function schedSave(m){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{status="saving";render();try{await fbSetStates(m);status="live";}catch(e){status="error";}render();},700);}
function schedSaveNote(id,txt){clearTimeout(noteTimer);noteTimer=setTimeout(async()=>{try{await fbSetNote(id,txt);}catch(e){console.error(e);}},800);}

async function sendMessage(txt){
  if(!txt.trim()||!currentUser)return;
  const msg={user:currentUser,text:txt.trim(),ts:Date.now()};
  // Add message locally immediately so it shows up without waiting for SSE
  messages=[...messages,msg].sort((a,b)=>a.ts-b.ts);
  markRead();render();scrollChat();
  // Re-focus input after render
  setTimeout(()=>{const inp=document.getElementById("chat-in");if(inp)inp.focus();},30);
  try{await fbPushMsg(msg);}catch(e){console.error("Error enviando mensaje:",e);}
}

// ── Export PNG ──
function exportPNG(){
  exporting=true;render();
  setTimeout(()=>{
    try{
      const sc=2,W=600,P=32,CW=(W-P*2-12)/2,CH=72,HH=90,SH=110,LH=28;
      const ROWS=Math.ceil(SPACES.length/2),GH=ROWS*(CH+10),TH=HH+SH+LH+GH+48;
      const today=new Date().getDay(),tIds=WEEKLY[today]||[];
      const dStr=new Date().toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"});
      const spaceIds=SPACES.map(s=>s.id);
      const vals=spaceIds.map(id=>parseInt(map[id])||0);
      const avg=vals.length>0?vals.reduce((a,b)=>a+b,0)/vals.length:0;
      const pct=Math.round((avg/5)*100)||0;
      const sc2=avg>=4?"#6C63FF":avg>=3?"#22C55E":avg>=2?"#EAB308":avg>=1?"#F97316":"#EF4444";
      const cv=document.createElement("canvas");cv.width=W*sc;cv.height=TH*sc;
      const ctx=cv.getContext("2d");ctx.scale(sc,sc);
      function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
      ctx.fillStyle="#f7f7f5";ctx.fillRect(0,0,W,TH);
      ctx.fillStyle="#fff";rr(P-8,12,W-(P-8)*2,HH-16,16);ctx.fill();
      ctx.fillStyle="#aaa";ctx.font="500 10px monospace";ctx.fillText("SISTEMA PRISMA · EJE HOGAR",P,42);
      ctx.fillStyle="#1a1a2e";ctx.font="bold 26px Georgia,serif";ctx.fillText("Mapa del Hogar",P,70);
      const pw=ctx.measureText(dStr).width+24;ctx.fillStyle="#1a1a2e";rr(W-P-pw,30,pw,24,12);ctx.fill();
      ctx.fillStyle="#fff";ctx.font="500 10px monospace";ctx.fillText(dStr,W-P-pw+12,46);
      const sY=HH+8;ctx.fillStyle="#fff";rr(P-8,sY,W-(P-8)*2,SH-12,16);ctx.fill();
      ctx.fillStyle="#aaa";ctx.textAlign="center";ctx.font="500 10px monospace";ctx.fillText("ESTADO GENERAL",W/2,sY+24);
      ctx.fillStyle=sc2;ctx.font="bold 44px Georgia,serif";ctx.fillText(pct+"%",W/2,sY+68);
      const bW=180,bX=(W-bW)/2,bY=sY+78;
      ctx.fillStyle="#ebebeb";rr(bX,bY,bW,6,3);ctx.fill();ctx.fillStyle=sc2;rr(bX,bY,bW*(pct/100),6,3);ctx.fill();ctx.textAlign="left";
      const gY=HH+SH+LH+4;ctx.fillStyle="#bbb";ctx.font="500 10px monospace";ctx.fillText("TODOS LOS ESPACIOS",P,gY-10);
      SPACES.forEach((sp,i)=>{
        const col=i%2,row=Math.floor(i/2),x=P+col*(CW+12),y=gY+row*(CH+10);
        const st=getSt(map[sp.id]),iT=tIds.includes(sp.id);
        ctx.fillStyle="#fff";rr(x,y,CW,CH,12);ctx.fill();
        ctx.strokeStyle=iT?st.color:"#e8e8e8";ctx.lineWidth=iT?2:1;rr(x,y,CW,CH,12);ctx.stroke();ctx.lineWidth=1;
        if(iT){ctx.fillStyle=st.color;rr(x+CW-44,y-8,40,16,8);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 8px monospace";ctx.textAlign="center";ctx.fillText("HOY",x+CW-24,y+4);ctx.textAlign="left";}
        ctx.font="17px serif";ctx.fillText(sp.icon,x+12,y+28);
        ctx.fillStyle="#1a1a2e";ctx.font="600 12px sans-serif";ctx.fillText(sp.name,x+36,y+28);
        ctx.font="16px serif";ctx.textAlign="right";ctx.fillText(st.symbol==="✦"?"✦":st.symbol,x+CW-12,y+28);ctx.textAlign="left";
        const ppw=ctx.measureText(st.short).width+18;ctx.fillStyle=st.bg;rr(x+12,y+38,ppw,20,10);ctx.fill();
        ctx.fillStyle=st.text;ctx.font="500 11px monospace";ctx.fillText(st.short,x+21,y+52);
      });
      ctx.fillStyle="#ccc";ctx.font="10px monospace";ctx.textAlign="center";ctx.fillText("Sistema Prisma · Eje Hogar",W/2,TH-12);
      const a=document.createElement("a");a.download=`hogar-prisma-${new Date().toISOString().slice(0,10)}.png`;a.href=cv.toDataURL("image/png");a.click();
    }catch(e){console.error(e);}
    exporting=false;render();
  },80);
}

// ── Render ──
const syncHtml={connecting:'<span class="sync">⟳ conectando...</span>',live:'<span class="sync live">● en vivo</span>',saving:'<span class="sync saving">↑ guardando...</span>',error:'<span class="sync error">⚠ sin conexión</span>'};

function renderUserPicker(){
  const root=document.getElementById("root");
  root.innerHTML=`<div class="user-screen"><div class="user-card">
    <div style="font-size:36px;margin-bottom:12px">🏠</div>
    <div class="user-title">¿Quién eres?</div>
    <div class="user-sub">Elige tu perfil para continuar</div>
    <div class="user-options">
      <div class="user-opt" id="u-Cris" style="border-color:#7B9DB4">
        <div class="user-opt-name">🧔 Cris</div>
        <div class="user-opt-sub">entrar como Cris</div>
      </div>
      <div class="user-opt" id="u-Syl" style="border-color:#6C63FF">
        <div class="user-opt-name">👩 Syl</div>
        <div class="user-opt-sub">entrar como Syl</div>
      </div>
    </div>
  </div></div>`;
  ["Cris","Syl"].forEach(u=>{
    document.getElementById("u-"+u).addEventListener("click",()=>{
      currentUser=u;safeSet("prisma-user",u);init();
    });
  });
};

function render(){
  const root=document.getElementById("root");
  if(!root)return;

  if(!currentUser){renderUserPicker();return;}

  if(status==="config"){
    root.innerHTML=`<div class="config-screen"><div class="config-card">
      <div style="font-size:32px;margin-bottom:12px">◈</div>
      <div class="config-title">Hogar Prisma</div>
      <div class="config-sub">Pega la URL de tu Firebase Realtime Database.<br/>
      Ejemplo:<br/><span style="color:#6C63FF">https://mi-proyecto-rtdb.firebaseio.com</span></div>
      <label class="config-label">URL DE FIREBASE</label>
      <input class="config-input" id="dbi" type="url" placeholder="https://..." value="${dbUrl}" />
      <div class="config-err" id="cerr">URL inválida. Debe empezar con https://</div>
      <button class="btn-primary" id="bsc">Conectar →</button>
    </div></div>`;
    document.getElementById("bsc").onclick=()=>{
      const v=document.getElementById("dbi").value.trim();
      if(!v.startsWith("https://")){document.getElementById("cerr").style.display="block";return;}
      dbUrl=v;safeSet("prisma-db-url",dbUrl);if(es)es.close();init();
    };
    return;
  }

  const today=new Date().getDay(),tIds=WEEKLY[today]||[],dn=DAYS[today];
  const spaceIds=SPACES.map(s=>s.id);
  const vals=spaceIds.map(id=>parseInt(map[id])||0);
  const avg=vals.length>0?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const pct=Math.round((avg/5)*100)||0;
  const sc=avg>=4?"#6C63FF":avg>=3?"#22C55E":avg>=2?"#EAB308":avg>=1?"#F97316":"#EF4444";
  const crit=SPACES.filter(s=>map[s.id]===0);

  function cardH(id,isT){
    const sp=SPACES.find(s=>s.id===id),st=getSt(map[id]),hasNote=!!(notes[id]&&notes[id].trim());
    return`<div class="card" data-id="${id}" style="border-color:${isT?st.color:"#ebebeb"}${isT?`;box-shadow:0 0 0 3px ${st.color}33`:""}">
      ${isT?`<div class="badge" style="background:${st.color}">hoy</div>`:""}
      <div class="card-top">
        <div class="card-name"><span style="font-size:18px">${sp.icon}</span><span class="card-title">${sp.name}${hasNote?'<span class="card-note-dot"></span>':""}</span></div>
        <span style="font-size:18px">${st.symbol}</span>
      </div>
      <div class="card-pill" style="background:${st.bg};color:${st.text}">${st.short}</div>
    </div>`;
  }

  const unread=unreadCount();
  const userColor=USERS[currentUser]?.color||"#6C63FF";
  const userAvatar=USERS[currentUser]?.avatar||"👤";

  root.innerHTML=`<div class="app">
    <div class="header">
      <div class="header-left"><div class="eyebrow">Sistema Prisma</div><h1>Eje Hogar</h1></div>
      <div class="header-right">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:'DM Mono',monospace;font-size:10px;color:${userColor}">${userAvatar} ${currentUser}</span>
          <div class="pill">${dn==="Domingo"?"🎲 Comodín":"📍 "+dn}</div>
        </div>
        ${syncHtml[status]||""}
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:28px">
      <div class="score-card" style="flex:1;max-width:300px">
        <span class="score-eyebrow">Estado general</span>
        <div style="display:flex;align-items:baseline;gap:4px">
          <span class="score-num" style="color:${sc}">${pct}</span>
          <span class="score-pct">%</span>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${sc}"></div></div>
      </div>
      <button class="chat-btn" id="bchat">
        💬
        ${unread>0?`<span class="unread">${unread>9?"9+":unread}</span>`:""}
      </button>
    </div>
    ${crit.length?`<div class="alert"><span style="font-size:22px">🟥</span><div>
      <div class="alert-title">${crit.length===1?"1 espacio crítico":crit.length+" espacios críticos"}</div>
      <div class="alert-sub">${crit.map(s=>s.name).join(", ")} → prioridad mañana</div>
    </div></div>`:""}
    ${tIds.length?`<div class="section-label">Zonas de hoy</div><div class="grid">${tIds.map(id=>cardH(id,true)).join("")}</div>`:""}
    <div class="section-label">Todos los espacios</div>
    <div class="grid">${SPACES.map(s=>cardH(s.id,tIds.includes(s.id))).join("")}</div>
    <div class="legend">
      <div class="section-label" style="margin-bottom:12px">Referencia de estados</div>
      ${STATES.map(st=>`<div class="legend-row"><span class="legend-sym">${st.symbol}</span><span class="legend-txt">${st.label}</span></div>`).join("")}
    </div>
    <button class="btn-export" id="bex" ${exporting?"disabled":""}>
      <span>${exporting?"⏳":"📸"}</span>${exporting?"generando imagen...":"sacar pantallazo"}
    </button>
    <button class="btn-sm" id="bcfg">⚙ cambiar base de datos · usuario: ${currentUser}</button>
    <div class="hint">toca cualquier espacio para actualizar su estado</div>
  </div>
  ${chatOpen?`<div class="chat-overlay" id="chat-ov">
    <div class="chat-sheet" style="--me-color:${userColor}">
      <div class="chat-head">
        <div class="chat-head-row">
          <div class="chat-title">💬 Chat del Hogar</div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="chat-user-badge" style="background:${userColor}">${userAvatar} ${currentUser}</span>
            <button class="chat-close" id="bcc">✕</button>
          </div>
        </div>
      </div>
      <div class="chat-messages" id="chat-msgs">
        ${messages.length===0?`<div style="text-align:center;padding:40px 0;font-family:'DM Mono',monospace;font-size:12px;color:#ccc">sin mensajes aún<br/>¡escribe el primero!</div>`:""}
        ${messages.map(m=>{
          const isMe=m.user===currentUser;
          const u=USERS[m.user]||{color:"#888",avatar:"👤"};
          const t=new Date(m.ts).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
          return`<div class="msg ${isMe?"me":"them"}">
            ${!isMe?`<div class="msg-author">${u.avatar} ${m.user}</div>`:""}
            <div class="msg-bubble">${m.text.replace(/</g,"&lt;")}</div>
            <div class="msg-time">${t}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-in" type="text" placeholder="Escribe un mensaje..." maxlength="300" />
        <button class="chat-send" id="chat-send">➤</button>
      </div>
    </div>
  </div>`:""}
  ${picking?`<div class="overlay" id="ov"><div class="sheet">
    <div class="handle"></div>
    ${viewingNotes?`
    <div class="note-view">
      <button class="note-back" id="bnb">← ${SPACES.find(s=>s.id===picking).icon} ${SPACES.find(s=>s.id===picking).name}</button>
      <textarea class="note-textarea" id="note-ta" placeholder="Anotaciones, pendientes, recordatorios...">${(notes[picking]||"").replace(/</g,"&lt;")}</textarea>
      <button class="note-save" id="bns">Guardar nota</button>
      <div class="note-hint">se sincroniza en tiempo real</div>
    </div>`:`
    <div class="sheet-header">
      <div>
        <div class="sheet-title">${SPACES.find(s=>s.id===picking).icon} ${SPACES.find(s=>s.id===picking).name}</div>
        <div class="sheet-sub">Selecciona el estado actual</div>
      </div>
      <button class="note-btn${notes[picking]&&notes[picking].trim()?" has-note":""}" id="bnote">🗒️</button>
    </div>
    ${STATES.map(st=>`<div class="opt" data-st="${st.id}" style="${map[picking]===st.id?`background:${st.bg};border-color:${st.color}`:""}">
      <span class="opt-sym">${st.symbol}</span>
      <span class="opt-label" style="color:${st.text};font-weight:${map[picking]===st.id?700:400}">${st.label}</span>
      ${map[picking]===st.id?`<span style="color:${st.color};font-size:16px">✓</span>`:""}
    </div>`).join("")}
    <button class="btn-cancel" id="bcl">cancelar</button>`}
  </div></div>`:""}`;

  // events
  document.querySelectorAll(".card").forEach(el=>el.addEventListener("click",()=>{picking=el.dataset.id;viewingNotes=false;render();}));
  document.getElementById("bex")?.addEventListener("click",exportPNG);
  document.getElementById("bcfg")?.addEventListener("click",()=>{currentUser="";try{localStorage.removeItem("prisma-user");}catch(e){}render();});
  document.getElementById("ov")?.addEventListener("click",e=>{if(e.target.id==="ov"){picking=null;viewingNotes=false;render();}});
  document.getElementById("bcl")?.addEventListener("click",()=>{picking=null;viewingNotes=false;render();});
  document.getElementById("bnote")?.addEventListener("click",()=>{viewingNotes=true;render();setTimeout(()=>document.getElementById("note-ta")?.focus(),50);});
  document.getElementById("bnb")?.addEventListener("click",()=>{viewingNotes=false;render();});
  document.getElementById("bns")?.addEventListener("click",()=>{
    const txt=document.getElementById("note-ta")?.value||"";
    notes={...notes,[picking]:txt};
    schedSaveNote(picking,txt);
    viewingNotes=false;render();
  });
  document.querySelectorAll(".opt").forEach(el=>el.addEventListener("click",()=>{
    const ns=parseInt(el.dataset.st);map={...map,[picking]:ns};picking=null;viewingNotes=false;render();schedSave(map);
  }));
  // chat events
  document.getElementById("bchat")?.addEventListener("click",()=>{chatOpen=true;markRead();render();scrollChat();});
  document.getElementById("bcc")?.addEventListener("click",()=>{chatOpen=false;render();});
  document.getElementById("chat-ov")?.addEventListener("click",e=>{if(e.target.id==="chat-ov"){chatOpen=false;render();}});
  const doSend=async()=>{
    const inp=document.getElementById("chat-in");
    const txt=inp?.value||"";if(!txt.trim())return;
    inp.value="";
    await sendMessage(txt);
  };
  document.getElementById("chat-send")?.addEventListener("click",doSend);
  document.getElementById("chat-in")?.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();}});
  if(chatOpen)scrollChat();
}

// Startup: always show something immediately
init();
