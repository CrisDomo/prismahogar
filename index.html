<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Hogar · Prisma</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
/* ✅ CSS ORIGINAL – SIN CAMBIOS */
</style>
</head>

<body>
<div id="root"><div class="loading">cargando...</div></div>

<script>
/* =====================================================
   BASE
===================================================== */

var SPACES = [
  {id:"jardin",name:"Jardín delantero",icon:"🌿"},
  {id:"auto",name:"Auto",icon:"🚗"},
  {id:"living",name:"Living",icon:"🛋️"},
  {id:"cocina",name:"Cocina",icon:"🍳"},
  {id:"bano",name:"Baño",icon:"🚿"},
  {id:"pasillo",name:"Pasillo",icon:"🚪"},
  {id:"pieza",name:"Pieza",icon:"🛏️"},
  {id:"oficina",name:"Oficina",icon:"💻"},
  {id:"pieza_atras",name:"Pieza de atrás",icon:"📦"},
  {id:"patio",name:"Patio",icon:"☀️"},
  {id:"pasillo_patio",name:"Pasillo patio",icon:"🌀"},
  {id:"bodegas",name:"Bodegas",icon:"🗄️"}
];

var STATES = [
  {id:5,symbol:"✦",label:"Ordenado y adornado",short:"Adornado",color:"#6C63FF",bg:"#f0eeff",text:"#3d3580"},
  {id:4,symbol:"🟦",label:"Ordenado (interior)",short:"Interior OK",color:"#3B82F6",bg:"#eff6ff",text:"#1d4ed8"},
  {id:3,symbol:"🟩",label:"Ordenado (exterior)",short:"Exterior OK",color:"#22C55E",bg:"#f0fdf4",text:"#15803d"},
  {id:2,symbol:"🟨",label:"Desordenado habitable",short:"Habitable",color:"#EAB308",bg:"#fefce8",text:"#854d0e"},
  {id:1,symbol:"🟧",label:"Desordenado incómodo",short:"Incómodo",color:"#F97316",bg:"#fff7ed",text:"#9a3412"},
  {id:0,symbol:"🟥",label:"Insulto a la dignidad",short:"Crítico",color:"#EF4444",bg:"#fef2f2",text:"#991b1b"}
];

var USERS = {
  Cris:{color:"#6C63FF",avatar:"🧔"},
  Syl:{color:"#FF6B9D",avatar:"👩"}
};

var map = {}, notes = {}, messages = [];
SPACES.forEach(s => map[s.id] = 2);

var currentUser = localStorage.getItem("prisma-user") || "";
var dbUrl = localStorage.getItem("prisma-db-url") || "";
var chatEs = null;

/* =====================================================
   UTILS
===================================================== */

function esc(s){
  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function cleanUrl(){
  return dbUrl.replace(/\/$/,"");
}

function scrollChat(){
  setTimeout(()=>{
    var el=document.getElementById("chat-msgs");
    if(el) el.scrollTop=el.scrollHeight;
  },50);
}

/* =====================================================
   FIREBASE
===================================================== */

function fbPushMsg(msg){
  return fetch(cleanUrl()+"/chat.json",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(msg)
  });
}

/* =====================================================
   CHAT LISTENER (✅ FIX FINAL)
===================================================== */

function listenChat(){
  if(chatEs) chatEs.close();

  chatEs = new EventSource(cleanUrl()+"/chat.json");

  function mergeIncoming(data){
    if(!data){ messages=[]; return; }

    var incoming = Object.values(data);
    var seen = {};

    messages.forEach(m=>{
      seen[m.ts + "_" + m.user] = true;
    });

    incoming.forEach(m=>{
      var k = m.ts + "_" + m.user;
      if(!seen[k]) messages.push(m);
    });

    messages.sort((a,b)=>a.ts-b.ts);
  }

  chatEs.addEventListener("put", e=>{
    try{
      var m = JSON.parse(e.data);
      mergeIncoming(m.data);
      render();
      scrollChat();
    }catch(err){console.error(err);}
  });

  chatEs.addEventListener("patch", e=>{
    try{
      var m = JSON.parse(e.data);
      mergeIncoming(m.data);
      render();
      scrollChat();
    }catch(err){console.error(err);}
  });
}

/* =====================================================
   SEND MESSAGE
===================================================== */

function sendMessage(txt){
  if(!txt || !txt.trim() || !currentUser) return;

  var msg={
    user:currentUser,
    text:txt.trim(),
    ts:Date.now()
  };

  messages.push(msg);          // ✅ instantáneo
  render();
  scrollChat();

  fbPushMsg(msg).catch(console.error);
}

/* =====================================================
   RENDER (CHAT)
===================================================== */

function render(){
  var root=document.getElementById("root");
  if(!root) return;

  if(!currentUser){
    root.innerHTML=`
      <div style="padding:40px">
        <button onclick="selectUser('Cris')">🧔 Cris</button>
        <button onclick="selectUser('Syl')">👩 Syl</button>
      </div>`;
    return;
  }

  var u=USERS[currentUser] || {};
  var color=u.color || "#6C63FF";

  root.innerHTML=`
    <div class="app">
      <h2>💬 Chat del Hogar</h2>

      <div class="chat-messages" id="chat-msgs">
        ${
          messages.length===0
          ? `<div style="color:#bbb">Sin mensajes aún</div>`
          : messages.map(m=>{
              var me=m.user===currentUser;
              return `
                <div class="msg ${me?'me':'them'}">
                  ${!me?`<div class="msg-author">${esc(m.user)}</div>`:""}
                  <div class="msg-bubble">${esc(m.text)}</div>
                </div>`;
            }).join("")
        }
      </div>

      <div class="chat-input-row">
        <input id="chat-in" placeholder="Escribe un mensaje...">
        <button id="chat-send">➤</button>
      </div>
    </div>`;

  document.getElementById("chat-send").onclick=()=>{
    var i=document.getElementById("chat-in");
    var t=i.value;
    i.value="";
    sendMessage(t);
  };

  document.getElementById("chat-in").onkeydown=e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      var t=e.target.value;
      e.target.value="";
      sendMessage(t);
    }
  };

  scrollChat();
}

/* =====================================================
   USER
===================================================== */

function selectUser(u){
  currentUser=u;
  localStorage.setItem("prisma-user",u);
  listenChat();
  render();
}

render();
</script>
</body>
</html>
